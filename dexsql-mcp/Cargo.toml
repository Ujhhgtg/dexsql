[package]
name = "dexsql-mcp"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
dexsql-cache = { path = "../dexsql-cache" }
dexsql-query = { path = "../dexsql-query" }
dexsql-schema = { path = "../dexsql-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
rmcp = { version = "=3.2.0", features = ["server", "transport-io"] }
rmcp-macros = "=3.2.0"
schemars = "=1.2.2"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
apk-info-axml = "1.0.13"
codepage-437 = "0.1.0"
