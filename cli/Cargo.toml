[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dexsql"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.1", features = ["derive", "std", "color", "help", "usage", "error-context", "suggestions"] }
dexsql = { path = "../dexsql" }
dexsql-cache = { path = "../dexsql-cache" }
dexsql-mcp = { path = "../dexsql-mcp" }
dexsql-query = { path = "../dexsql-query" }
dexsql-schema = { path = "../dexsql-schema" }
serde_json = "1"
